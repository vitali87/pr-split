name: PR Split Score

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pr-split score
        uses: vitali87/pr-split@72eac99fbf642ab73ac3d0ef1d94d33148a2e2aa # v1.1.0
        with:
          max-loc: "400"
          partition-strategy: "graph"
          threshold-groups: "2"
